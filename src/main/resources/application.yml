server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:5080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventflow}
    username: ${DB_USER:eventflow}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
