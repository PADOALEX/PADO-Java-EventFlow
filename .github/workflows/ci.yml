name: Build and PostgreSQL integration tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: java_eventflow_test
          POSTGRES_USER: eventflow
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventflow -d java_eventflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      EVENTFLOW_TEST_DB_URL: jdbc:postgresql://localhost:5432/java_eventflow_test
      EVENTFLOW_TEST_DB_USER: eventflow
      EVENTFLOW_TEST_DB_PASSWORD: ci-only-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -Pintegration verify
      - name: Resolve dependency inventory
        run: mvn --batch-mode --no-transfer-progress dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
      - name: Check Maven dependencies against OSV
        run: python3 scripts/audit_dependencies.py target/dependency-tree.json
